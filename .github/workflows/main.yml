name: Release

# ---------------------------------------------------------------------------
# Walnut Agent release pipeline.
#
# IMPORTANT: this workflow must live in the GitHub repo (walnutai-labs/Walnut-Agent).
# The source of truth is self-hosted GitLab; each runner clones it at build time,
# so nothing is committed to GitHub except the release + docs + this file.
#
# Trigger: Actions -> Release -> Run workflow -> enter the tag (already pushed to
# GitLab), e.g. v0.5.0 (prod) or v0.5.0-qa.1 / v0.5.0-dev.3 (pre-release / internal).
# Tags with a "-suffix" are published as GitHub pre-releases, so the prod
# auto-updater (which reads /releases/latest) never sees them.
#
# Jobs run in parallel after create-release:
#   windows      -> windows-latest  (NSIS installer + zip, signed)
#   macos-arm64  -> macos-26        (Apple Silicon, native)  DMG + zip, signed + notarized
#   macos-x64    -> macos-15-intel  (Intel, native)          DMG + zip, signed + notarized
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (must already exist in GitLab). e.g. v0.5.0 or v0.5.0-qa.1"
        required: true

# Needed for gh release create/upload with the default GITHUB_TOKEN
permissions:
  contents: write

jobs:
  # Create the release once, up front, so the parallel build jobs only upload
  # (avoids a race where multiple jobs try to create the same release).
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # --target main: anchor the tag to the GitHub repo's main (the source
            # commit lives in GitLab, so gh can't use it). The commit is just a
            # label; the auto-updater only reads the tag name + assets.
            gh release create "$TAG" --target main --title "$TAG" --notes "Automated build for $TAG" $PRERELEASE
          fi

  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Clone source from GitLab at tag
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.tag }}" \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.devopsark.com/walnut/walnut-agent.git" src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set package version from tag
        shell: bash
        working-directory: src
        run: |
          VER="${{ github.event.inputs.tag }}"; VER="${VER#v}"
          npm version "$VER" --no-git-tag-version --allow-same-version

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: src/playwright-browsers/win64
          key: pw-win64-${{ hashFiles('src/package.json') }}

      - name: Install dependencies
        shell: bash
        working-directory: src
        run: npm install         # package-lock.json is not tracked, so npm ci is not usable

      - name: Build + package (signed)
        shell: bash
        working-directory: src
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build:win64:ci

      - name: Upload Windows artifacts
        shell: bash
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.event.inputs.tag }}" \
            "release/Walnut Agent Setup"*.exe \
            release/*-win.zip \
            --clobber

  macos-arm64:
    needs: create-release
    runs-on: macos-26        # Apple Silicon — native arm64 build (macos-14 retired Nov 2, 2026)
    steps:
      - name: Clone source from GitLab at tag
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.tag }}" \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.devopsark.com/walnut/walnut-agent.git" src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set package version from tag
        working-directory: src
        run: |
          VER="${{ github.event.inputs.tag }}"; VER="${VER#v}"
          npm version "$VER" --no-git-tag-version --allow-same-version

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: src/playwright-browsers/macarm64
          # Image name in the key so browsers cached on macos-14 are not reused
          key: pw-macarm64-macos26-${{ hashFiles('src/package.json') }}

      - name: Install dependencies
        working-directory: src
        run: npm install

      - name: Build + package (signed + notarized)
        working-directory: src
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Strip extended attributes (quarantine/provenance/FinderInfo) from the
          # bundled browsers before signing; they cause "signature invalid" at
          # notarization and the __MACOSX entries in the notary zip.
          xattr -cr playwright-browsers || true
          # Bundled Playwright browsers (WebKit/Chromium/Firefox) contain tens of
          # thousands of files; raise the macOS open-file limit so electron-builder
          # does not hit EMFILE while signing/copying them.
          sudo launchctl limit maxfiles 65536 200000
          ulimit -n 65536
          npm run build:dmg-arm64:ci

      - name: Diagnose signature
        if: failure()
        working-directory: src
        run: |
          APP="$(find release -maxdepth 2 -name '*.app' -type d | head -1)"
          echo "App: $APP"
          [ -n "$APP" ] || { echo "No .app found under release/"; exit 0; }
          BROWSERS="$APP/Contents/Resources/playwright-browsers"
          MAIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          WEBKIT="$(find "$BROWSERS" -maxdepth 3 -name 'WebKit.framework' -type d | head -1)"

          echo "=== 1. Signature xattrs (com.apple.cs.*) — which files carry them ==="
          xattr -lr "$APP" 2>/dev/null | grep 'com.apple.cs\.' | cut -d: -f1 | sort -u | head -40 || true
          echo "=== 1b. All xattr names present anywhere in the bundle ==="
          xattr -lr "$APP" 2>/dev/null | awk -F': ' '{print $2}' | sort | uniq -c | sort -rn | head || true

          echo "=== 2. Main executable: who signed it, and strict verify ==="
          codesign -dvv "$MAIN" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier|flags|Sealed Resources|Internal requirements' || true
          codesign --verify --strict --verbose=2 "$MAIN" 2>&1 || true

          echo "=== 3. WebKit.framework: who signed it, and strict verify ==="
          if [ -n "$WEBKIT" ]; then
            codesign -dvv "$WEBKIT" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier|flags|Sealed Resources' || true
            codesign --verify --strict --verbose=2 "$WEBKIT" 2>&1 || true
            codesign --verify --strict --verbose=2 "$WEBKIT/Versions/A/WebKit" 2>&1 || true
          fi

          echo "=== 4. Chrome helper app (one of the __MACOSX entries) ==="
          HELPER="$(find "$BROWSERS" -name 'Google Chrome for Testing Helper (Alerts).app' -type d | head -1)"
          if [ -n "$HELPER" ]; then
            xattr -l "$HELPER" 2>/dev/null || true
            codesign -dvv "$HELPER" 2>&1 | grep -E 'Authority|flags' || true
            codesign --verify --strict --verbose=2 "$HELPER" 2>&1 || true
          fi

          echo "=== 5. Round-trip through the same zip the notary receives ==="
          RT="$RUNNER_TEMP/rt"; rm -rf "$RT"; mkdir -p "$RT"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RT/app.zip"
          echo "-- __MACOSX / ._ entries in zip:"
          unzip -l "$RT/app.zip" | grep -cE '__MACOSX|/\._' || true
          ditto -x -k "$RT/app.zip" "$RT/out"
          RTAPP="$RT/out/$(basename "$APP")"
          echo "-- main exe after round-trip:"
          codesign --verify --strict --verbose=2 "$RTAPP/Contents/MacOS/$(basename "$APP" .app)" 2>&1 || true
          echo "-- WebKit after round-trip:"
          RTWK="$(find "$RTAPP/Contents/Resources/playwright-browsers" -maxdepth 3 -name 'WebKit.framework' -type d | head -1)"
          [ -n "$RTWK" ] && codesign --verify --strict --verbose=2 "$RTWK/Versions/A/WebKit" 2>&1 || true
          echo "-- whole app after round-trip:"
          codesign --verify --deep --strict --verbose=2 "$RTAPP" 2>&1 | tail -5 || true


      - name: Upload macOS arm64 artifacts
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.event.inputs.tag }}" \
            release/*-mac-arm64.dmg \
            release/*-mac-arm64.zip \
            --clobber

  macos-x64:
    needs: create-release
    runs-on: macos-15-intel  # Intel — native x64 build (macos-13 was retired Dec 2025;
                             # macos-15-intel is the last Intel image, available until Aug 2027)
    steps:
      - name: Clone source from GitLab at tag
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.tag }}" \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.devopsark.com/walnut/walnut-agent.git" src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set package version from tag
        working-directory: src
        run: |
          VER="${{ github.event.inputs.tag }}"; VER="${VER#v}"
          npm version "$VER" --no-git-tag-version --allow-same-version

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: src/playwright-browsers/macx64
          key: pw-macx64-macos15-${{ hashFiles('src/package.json') }}

      - name: Install dependencies
        working-directory: src
        run: npm install

      - name: Build + package (signed + notarized)
        working-directory: src
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Strip extended attributes from the bundled browsers before signing.
          xattr -cr playwright-browsers || true
          # Bundled Playwright browsers (WebKit/Chromium/Firefox) contain tens of
          # thousands of files; raise the macOS open-file limit so electron-builder
          # does not hit EMFILE while signing/copying them.
          sudo launchctl limit maxfiles 65536 200000
          ulimit -n 65536
          npm run build:dmg-x64:ci

      - name: Diagnose signature
        if: failure()
        working-directory: src
        run: |
          APP="$(find release -maxdepth 2 -name '*.app' -type d | head -1)"
          echo "App: $APP"
          [ -n "$APP" ] || { echo "No .app found under release/"; exit 0; }
          BROWSERS="$APP/Contents/Resources/playwright-browsers"
          MAIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          WEBKIT="$(find "$BROWSERS" -maxdepth 3 -name 'WebKit.framework' -type d | head -1)"

          echo "=== 1. Signature xattrs (com.apple.cs.*) — which files carry them ==="
          xattr -lr "$APP" 2>/dev/null | grep 'com.apple.cs\.' | cut -d: -f1 | sort -u | head -40 || true
          echo "=== 1b. All xattr names present anywhere in the bundle ==="
          xattr -lr "$APP" 2>/dev/null | awk -F': ' '{print $2}' | sort | uniq -c | sort -rn | head || true

          echo "=== 2. Main executable: who signed it, and strict verify ==="
          codesign -dvv "$MAIN" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier|flags|Sealed Resources|Internal requirements' || true
          codesign --verify --strict --verbose=2 "$MAIN" 2>&1 || true

          echo "=== 3. WebKit.framework: who signed it, and strict verify ==="
          if [ -n "$WEBKIT" ]; then
            codesign -dvv "$WEBKIT" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier|flags|Sealed Resources' || true
            codesign --verify --strict --verbose=2 "$WEBKIT" 2>&1 || true
            codesign --verify --strict --verbose=2 "$WEBKIT/Versions/A/WebKit" 2>&1 || true
          fi

          echo "=== 4. Chrome helper app (one of the __MACOSX entries) ==="
          HELPER="$(find "$BROWSERS" -name 'Google Chrome for Testing Helper (Alerts).app' -type d | head -1)"
          if [ -n "$HELPER" ]; then
            xattr -l "$HELPER" 2>/dev/null || true
            codesign -dvv "$HELPER" 2>&1 | grep -E 'Authority|flags' || true
            codesign --verify --strict --verbose=2 "$HELPER" 2>&1 || true
          fi

          echo "=== 5. Round-trip through the same zip the notary receives ==="
          RT="$RUNNER_TEMP/rt"; rm -rf "$RT"; mkdir -p "$RT"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RT/app.zip"
          echo "-- __MACOSX / ._ entries in zip:"
          unzip -l "$RT/app.zip" | grep -cE '__MACOSX|/\._' || true
          ditto -x -k "$RT/app.zip" "$RT/out"
          RTAPP="$RT/out/$(basename "$APP")"
          echo "-- main exe after round-trip:"
          codesign --verify --strict --verbose=2 "$RTAPP/Contents/MacOS/$(basename "$APP" .app)" 2>&1 || true
          echo "-- WebKit after round-trip:"
          RTWK="$(find "$RTAPP/Contents/Resources/playwright-browsers" -maxdepth 3 -name 'WebKit.framework' -type d | head -1)"
          [ -n "$RTWK" ] && codesign --verify --strict --verbose=2 "$RTWK/Versions/A/WebKit" 2>&1 || true
          echo "-- whole app after round-trip:"
          codesign --verify --deep --strict --verbose=2 "$RTAPP" 2>&1 | tail -5 || true


      - name: Upload macOS x64 artifacts
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.event.inputs.tag }}" \
            release/*-mac-x64.dmg \
            release/*-mac-x64.zip \
            --clobber

name: Release

# ---------------------------------------------------------------------------
# Walnut Agent release pipeline.
#
# IMPORTANT: this workflow must live in the GitHub repo (walnutai-labs/Walnut-Agent).
# The source of truth is self-hosted GitLab; each runner clones it at build time,
# so nothing is committed to GitHub except the release + docs + this file.
#
# Trigger: Actions -> Release -> Run workflow -> enter the tag (already pushed to
# GitLab), e.g. v0.5.0 (prod) or v0.5.0-qa.1 / v0.5.0-dev.3 (pre-release / internal).
# Tags with a "-suffix" are published as GitHub pre-releases, so the prod
# auto-updater (which reads /releases/latest) never sees them.
#
# Jobs run in parallel after create-release:
#   windows      -> windows-latest  (NSIS installer + zip, signed)
#   macos-arm64  -> macos-14 (Apple Silicon, native)  DMG + zip, signed + notarized
#   macos-x64    -> macos-13 (Intel, native)          DMG + zip, signed + notarized
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (must already exist in GitLab). e.g. v0.5.0 or v0.5.0-qa.1"
        required: true

# Needed for gh release create/upload with the default GITHUB_TOKEN
permissions:
  contents: write

jobs:
  # Create the release once, up front, so the parallel build jobs only upload
  # (avoids a race where multiple jobs try to create the same release).
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # --target main: anchor the tag to the GitHub repo's main (the source
            # commit lives in GitLab, so gh can't use it). The commit is just a
            # label; the auto-updater only reads the tag name + assets.
            gh release create "$TAG" --target main --title "$TAG" --notes "Automated build for $TAG" $PRERELEASE
          fi

  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Clone source from GitLab at tag
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.tag }}" \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.devopsark.com/walnut/walnut-agent.git" src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set package version from tag
        shell: bash
        working-directory: src
        run: |
          VER="${{ github.event.inputs.tag }}"; VER="${VER#v}"
          npm version "$VER" --no-git-tag-version --allow-same-version

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: src/playwright-browsers/win64
          key: pw-win64-${{ hashFiles('src/package.json') }}

      - name: Install dependencies
        shell: bash
        working-directory: src
        run: npm install         # package-lock.json is not tracked, so npm ci is not usable

      - name: Build + package (signed)
        shell: bash
        working-directory: src
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build:win64:ci

      - name: Upload Windows artifacts
        shell: bash
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.event.inputs.tag }}" \
            "release/Walnut Agent Setup"*.exe \
            release/*-win.zip \
            --clobber

  macos-arm64:
    needs: create-release
    runs-on: macos-14        # Apple Silicon — native arm64 build
    steps:
      - name: Clone source from GitLab at tag
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.tag }}" \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.devopsark.com/walnut/walnut-agent.git" src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set package version from tag
        working-directory: src
        run: |
          VER="${{ github.event.inputs.tag }}"; VER="${VER#v}"
          npm version "$VER" --no-git-tag-version --allow-same-version

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: src/playwright-browsers/macarm64
          key: pw-macarm64-${{ hashFiles('src/package.json') }}

      - name: Install dependencies
        working-directory: src
        run: npm install

      - name: Build + package (signed + notarized)
        working-directory: src
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Bundled Playwright browsers (WebKit/Chromium/Firefox) contain tens of
          # thousands of files; raise the macOS open-file limit so electron-builder
          # does not hit EMFILE while signing/copying them.
          sudo launchctl limit maxfiles 65536 200000
          ulimit -n 65536
          npm run build:dmg-arm64:ci

      - name: Upload macOS arm64 artifacts
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.event.inputs.tag }}" \
            release/*-mac-arm64.dmg \
            release/*-mac-arm64.zip \
            --clobber

  macos-x64:
    needs: create-release
    runs-on: macos-15-intel  # Intel — native x64 build (macos-13 was retired Dec 2025;
                             # macos-15-intel is the last Intel image, available until Aug 2027)
    steps:
      - name: Clone source from GitLab at tag
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.tag }}" \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.devopsark.com/walnut/walnut-agent.git" src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set package version from tag
        working-directory: src
        run: |
          VER="${{ github.event.inputs.tag }}"; VER="${VER#v}"
          npm version "$VER" --no-git-tag-version --allow-same-version

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: src/playwright-browsers/macx64
          key: pw-macx64-${{ hashFiles('src/package.json') }}

      - name: Install dependencies
        working-directory: src
        run: npm install

      - name: Build + package (signed + notarized)
        working-directory: src
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Bundled Playwright browsers (WebKit/Chromium/Firefox) contain tens of
          # thousands of files; raise the macOS open-file limit so electron-builder
          # does not hit EMFILE while signing/copying them.
          sudo launchctl limit maxfiles 65536 200000
          ulimit -n 65536
          npm run build:dmg-x64:ci

      - name: Upload macOS x64 artifacts
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.event.inputs.tag }}" \
            release/*-mac-x64.dmg \
            release/*-mac-x64.zip \
            --clobber
